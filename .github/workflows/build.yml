name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/images/**', 'docs/screenshots/**', 'docs/readme/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: NDK and gomobile
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
      - name: Generate Android icons
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo = Image.open("app/assets/logo.png").convert("RGBA")
          res_dir = "app/android/app/src/main/res"
          densities = {
              "mipmap-mdpi": 1.0,
              "mipmap-hdpi": 1.5,
              "mipmap-xhdpi": 2.0,
              "mipmap-xxhdpi": 3.0,
              "mipmap-xxxhdpi": 4.0,
          }

          corner = logo.getpixel((0, 0))
          bg_color = corner if corner[3] > 0 else (0, 0, 0, 255)

          for folder_name, scale in densities.items():
              folder = os.path.join(res_dir, folder_name)
              os.makedirs(folder, exist_ok=True)
              launcher_px = round(48 * scale)
              adaptive_px = round(108 * scale)
              fg_px = round(72 * scale)
              logo.resize((launcher_px, launcher_px), Image.LANCZOS).save(
                  os.path.join(folder, "ic_launcher.png"), optimize=True
              )
              fg_canvas = Image.new("RGBA", (adaptive_px, adaptive_px), (0, 0, 0, 0))
              fg_logo = logo.resize((fg_px, fg_px), Image.LANCZOS)
              offset = (adaptive_px - fg_px) // 2
              fg_canvas.alpha_composite(fg_logo, (offset, offset))
              fg_canvas.save(os.path.join(folder, "ic_launcher_foreground.png"), optimize=True)
              Image.new("RGBA", (adaptive_px, adaptive_px), bg_color).save(
                  os.path.join(folder, "ic_launcher_background.png"), optimize=True
              )
          EOF
      - name: Build Android APK
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"
          mkdir -p app/android/app/libs
          flags="-s -w -X github.com/armanlife/arman-vpn-client/core/internal/version.Current=$v"
          (cd core && gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags "$flags" \
            -o ../app/android/app/libs/core.aar ./mobile)
          cd app
          flutter pub get
          mkdir -p ../out
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=$v
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/Pani-VPN-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=$v
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Pani-VPN-Android-universal.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Pani-VPN-Android
          path: out/*
          if-no-files-found: error
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"; if gh release view "v$v" >/dev/null 2>&1; then gh release upload "v$v" out/*.apk --clobber; else gh release create "v$v" out/*.apk --title "v$v" --generate-notes; fi
